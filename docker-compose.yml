services:
  geoserver:
    image: docker.osgeo.org/geoserver:2.28.2
    container_name: geoserver-bsd
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - GEOSERVER_ADMIN_USER=${GEOSERVER_USER}
      - GEOSERVER_ADMIN_PASSWORD=${GEOSERVER_PASSWORD}
      - POSTGRES_HOST=host.docker.internal
      - POSTGRES_PORT=${DB_PORT}
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USERNAME=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_JNDI_RESOURCE_NAME=jdbc/PostGISDB
      - POSTGRES_JNDI_ENABLED=true
    volumes:
      - ./geoserver_data:/opt/geoserver_data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - geoportal-net

  backend:
    build: ./backend
    container_name: backend-geoportal
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}
      - GEOSERVER_URL=http://geoserver:8080/geoserver
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      geoserver:
        condition: service_started  
    networks:
      - geoportal-net

  frontend:
    build: ./frontend
    container_name: frontend-geoportal
    restart: always
    ports:
      - "5500:80"
    depends_on:
      - backend
    networks:
      - geoportal-net

networks:
  geoportal-net:
    driver: bridge