# ======================================================================
# Geoportal BSD — backend FastAPI.
#
# Requisitos previos (no se crean aquí):
#   1. Red Docker externa:   docker network create geoportal-net
#   2. GeoServer corriendo accesible como http://geoserver-bsd:8080
#      dentro de geoportal-net (despliegue aparte; sus datos NO van aquí).
#   3. PostGIS en el HOST en el puerto 5433 (host.docker.internal).
#   4. Archivo .env en esta carpeta (copiar .env.example y rellenar).
#
# Despliegue:  docker compose build backend && docker compose up -d backend
# Migraciones: docker compose exec backend python scripts/migrate.py
# ======================================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: geoportal-bsd-backend:latest
    container_name: backend-geoportal
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=${DB_PORT}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      # Aquí SÍ se expanden las variables
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@host.docker.internal:${DB_PORT}/${DB_NAME}
      - GEOSERVER_URL=http://geoserver-bsd:8080/geoserver
      - GEOSERVER_USER=${GEOSERVER_USER}
      - GEOSERVER_PASSWORD=${GEOSERVER_PASSWORD}
      - GEOSERVER_WORKSPACE=${GEOSERVER_WORKSPACE}
      - MAPTILER_KEY=${MAPTILER_KEY}
      # CORS_ORIGINS: orígenes exactos que sirven el frontend, separados por
      # coma. En producción (frontend y API tras el mismo dominio) basta el
      # dominio público; en dev, el dev server de Astro.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:4321}
      # DEBUG habilita /docs y tracebacks detallados: FALSE en producción.
      - DEBUG=${DEBUG:-False}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/storage:/app/storage
    networks:
      - geoportal-net

networks:
  geoportal-net:
    external: true
    name: geoportal-net
