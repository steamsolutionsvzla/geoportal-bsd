<div class="login-wrapper">
  <div class="login-card">

    <div class="login-logo">
      <div class="logo-circle">EC</div>
      <h1>Empresa Corp</h1>
      <p>Accede a tu panel de trabajo</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" novalidate>

      <div class="input-group" [class.has-error]="email?.invalid && email?.touched">
        <label for="email">Correo corporativo</label>
        <input id="email" type="email" formControlName="email" placeholder="nombre@empresa.com" />
        <span class="error-msg" *ngIf="email?.touched && email?.errors?.['required']">El correo es obligatorio</span>
        <span class="error-msg" *ngIf="email?.touched && email?.errors?.['email']">Ingresa un correo válido</span>
      </div>

      <div class="input-group" [class.has-error]="password?.invalid && password?.touched">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
          />
          <button type="button" class="toggle-password" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁' }}
          </button>
        </div>
        <span class="error-msg" *ngIf="password?.touched && password?.errors?.['required']">La contraseña es obligatoria</span>
        <span class="error-msg" *ngIf="password?.touched && password?.errors?.['minlength']">Debe tener al menos 6 caracteres</span>
      </div>

      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" formControlName="remember" />
          <span>Recordarme</span>
        </label>
        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-login" [disabled]="loading">
        {{ loading ? 'Verificando...' : 'Iniciar sesión' }}
      </button>

      <div class="alert show" [ngClass]="alertType" *ngIf="alertMsg">{{ alertMsg }}</div>

    </form>
  </div>
</div>
