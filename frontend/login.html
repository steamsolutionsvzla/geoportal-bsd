<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="css/login.css">
</head>
<body>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-logo">
        <div class="logo-circle">EC</div>
        <h1>Geoportal</h1>
        <p>Accede a tu panel de trabajo</p>
      </div>

      <form id="loginForm" novalidate>

        <div class="input-group">
          <label for="email">Correo corporativo</label>
          <input type="email" id="email" name="email" placeholder="nombre@empresa.com" required>
          <span class="error-msg" id="emailError"></span>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="••••••••" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña">👁</button>
          </div>
          <span class="error-msg" id="passwordError"></span>
        </div>

        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember">
            <span>Recordarme</span>
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <span class="btn-text">Iniciar sesión</span>
          <span class="spinner" id="spinner"></span>
        </button>

        <div class="alert" id="alertBox"></div>

      </form>

      <div class="login-footer">
        <p>¿No tienes cuenta? <a href="#">Solicita acceso a TI</a></p>
      </div>

    </div>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
