<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Geoportal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
</head>
<body>

  <div class="login-wrapper">

    <div class="login-topline mono">
      <span><span class="dot"></span>GEOPORTAL v0.1</span>
      <span>SESIÓN SEGURA</span>
    </div>

    <div class="login-card coord-frame">
      <span class="tick-tl"></span><span class="tick-tr"></span><span class="tick-bl"></span><span class="tick-br"></span>

      <div class="login-logo">
       <img src="img/logo.png" alt="Geoportal" class="logo-img">
        <h1>Geoportal</h1>
        <p>Accede a tu panel de trabajo</p>
      </div>

      <form id="loginForm" novalidate>

        <div class="input-group">
          <label for="email">Correo corporativo</label>
          <input type="email" id="email" name="email" placeholder="nombre@empresa.com" required>
          <span class="error-msg" id="emailError"></span>
        </div>

        <div class="input-group">
          <label for="password">Contraseña</label>
          <div class="password-field">
            <input type="password" id="password" name="password" placeholder="" required>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Mostrar contraseña"></button>
          </div>
          <span class="error-msg" id="passwordError"></span>
        </div>

        <div class="options-row">
          <label class="checkbox-label">
            <input type="checkbox" id="remember">
            <span>Recordarme</span>
          </label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-login" id="btnLogin">
          <span class="btn-text">Iniciar sesión</span>
          <span class="spinner" id="spinner"></span>
        </button>

        <div class="alert" id="alertBox"></div>

      </form>

      <div class="login-footer">
        <p>¿No tienes cuenta? <a href="#">Solicita acceso a TI</a></p>
      </div>

    </div>

    <div class="login-bottomline mono">
      <span>DATUM WGS84 · EPSG:4326</span>
      <span>ESTADO OPERATIVO</span>
    </div>

  </div>

  <script src="js/login.js"></script>
</body>
</html>
